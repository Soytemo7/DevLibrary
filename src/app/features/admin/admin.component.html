<section class="admin">

  <div class="heading">

    <span>
      ADMINISTRATION
    </span>

    <h1>
      Agregar recurso
    </h1>

    <p>
      Guarda algo que quieras volver a encontrar
      posteriormente.
    </p>

  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="save()"
  >

    <mat-form-field appearance="outline">
      <mat-label>
        Título
      </mat-label>

      <input
        matInput
        formControlName="title"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>
        URL
      </mat-label>

      <input
        matInput
        formControlName="url"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>
        Descripción
      </mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="description"
      ></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>
        Imagen / Screenshot
      </mat-label>

      <input
        matInput
        formControlName="image"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Tipo
      </mat-label>

      <mat-select
        formControlName="type"
      >

        <mat-option value="WEB_PAGE">
          Página web
        </mat-option>

        <mat-option value="COMPONENT">
          Componente
        </mat-option>

        <mat-option value="SNIPPET">
          Snippet
        </mat-option>

        <mat-option value="DOCUMENTATION">
          Documentación
        </mat-option>

        <mat-option value="VIDEO">
          Video
        </mat-option>

        <mat-option value="TOOL">
          Herramienta
        </mat-option>

        <mat-option value="GITHUB_REPOSITORY">
          GitHub
        </mat-option>

        <mat-option value="ARTICLE">
          Artículo
        </mat-option>

      </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>
        Tags
      </mat-label>

      <input
        matInput
        formControlName="tags"
        placeholder="angular, css, animation"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>
        Tecnologías
      </mat-label>

      <input
        matInput
        formControlName="technologies"
        placeholder="Angular, SCSS, TypeScript"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>
        Mis notas
      </mat-label>

      <textarea
        matInput
        rows="5"
        formControlName="notes"
      ></textarea>
    </mat-form-field>

    <label class="checkbox">

      <input
        type="checkbox"
        formControlName="featured"
      />

      Mostrar como destacado

    </label>

    <button
      mat-flat-button
      type="submit"
    >
      Guardar recurso
    </button>

    @if (saved) {

      <div class="success">
        Recurso guardado correctamente.
      </div>

    }

  </form>

</section>
