<div class="shell">

  <header class="topbar">

    <a
      routerLink="/"
      class="brand"
    >

      <div class="logo">
        <mat-icon>code</mat-icon>
      </div>

      <div>
        <strong>DevLibrary</strong>
        <span>RESOURCE LIBRARY</span>
      </div>

    </a>

    <nav>

      <a routerLink="/">
        <mat-icon>grid_view</mat-icon>
        Biblioteca
      </a>

      <a routerLink="/search">
        <mat-icon>search</mat-icon>
        Buscar
      </a>

      <a routerLink="/admin">
        <mat-icon>tune</mat-icon>
        Admin
      </a>

    </nav>

    <button
      mat-icon-button
      (click)="logout()"
      aria-label="Cerrar sesión"
    >
      <mat-icon>logout</mat-icon>
    </button>

  </header>

  <main class="content">

    <router-outlet />

  </main>

</div>
